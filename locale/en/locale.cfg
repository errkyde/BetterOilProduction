[item-description]
better-pumpjack-mk2=Extracts oil at twice the speed of the vanilla pumpjack.
better-pumpjack-mk3=Extracts oil at four times the speed of the vanilla pumpjack.
better-pumpjack-eco=Extracts oil at the same rate as the vanilla pumpjack but depletes the field five times slower. Ideal for keeping oil patches alive indefinitely.
bop-hydrocarbon-chunk=A dense chunk of carbon-rich asteroid material. Combine with water in any assembling machine to produce synthetic crude.
bop-synthetic-crude=Solidified synthetic crude processed from hydrocarbon chunks in space. Heat it in a chemical plant on the planet to yield crude oil.
bop-fracking-station=Injects high-pressure steam into an adjacent oil field to free trapped hydrocarbons. Must be placed directly next to a pumpjack. Limit: one per pumpjack.
bop-eor-injector=Continuously injects light oil into nearby oil formations, slowly restoring yield on depleted patches. Can be stacked for faster recovery.

