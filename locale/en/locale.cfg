[tips-and-tricks-item-description]
bop-eco-pumpjack=Extracts oil at the same rate as the vanilla pumpjack but depletes the field five times slower. Ideal for legacy patches you want to keep alive indefinitely.
bop-space-synthesis=Carbonic asteroids drop Hydrocarbon Chunks when crushed (30% chance). Combine them with water in any assembling machine (AM2 or better) to produce Synthetic Crude — rocket it back to Nauvis and heat it in a chemical plant to yield 500 crude oil.
bop-fracking=Place a Fracking Station directly adjacent (N/S/E/W) to any pumpjack and connect it to a steam supply. It injects steam into the formation to free trapped oil, boosting the field by up to 10% of its original yield. Limit: one station per pumpjack.
bop-eor=Place an EOR Injector near a depleted oil field and supply it with light oil. It slowly restores yield up to 70% of the original — at a rate roughly 3× more valuable than the light oil spent. Multiple injectors stack. Best used on fields that are below 50% yield.

[bop]
no-adjacent-pumpjack=No pumpjack adjacent — place directly next to a pumpjack.
already-fracking=This pumpjack already has a Fracking Station.
no-oil-field=No oil field here — place directly on a crude oil deposit.
