[technology-description]
better-pumpjack=Unlocks the Better Pumpjack (2× extraction speed).
better-pumpjack-mk2=Unlocks the Better Pumpjack Mk2 (4× extraction speed).
better-pumpjack-eco=Unlocks the Eco-Friendly Pumpjack: half the speed of vanilla, but depletes fields ten times slower.
bop-space-oil-synthesis=Crush carbonic asteroids for Hydrocarbon Chunks, combine them with water in space to produce Synthetic Crude, then process it on the planet into 300 crude oil per unit.
bop-fracking=Unlocks the Fracking Station: place it next to a pumpjack to inject steam and slowly boost field yield up to 150%.
bop-eor=Unlocks the EOR Injector and Polymer Slurry. Restores depleted oil fields up to 70% of their original richness. Apply before fracking for best results.

[fluid-name]
bop-polymer-slurry=Polymer Slurry

[fluid-description]
bop-polymer-slurry=A chemical injection compound used for enhanced oil recovery. More effective than steam or light oil, but requires a dedicated production line.

