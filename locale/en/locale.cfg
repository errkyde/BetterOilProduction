[technology-description]
advanced-pumpjacks=Unlocks the Better Pumpjack, which extracts oil at twice the speed of the vanilla pumpjack.
advanced-pumpjacks-mk3=Unlocks the Better Pumpjack Mk2, which extracts oil at four times the speed of the vanilla pumpjack.
eco-pumpjacks=Unlocks the ability to build pumpjacks with minimal depletion of the resource, ensuring sustainable extraction practices.
bop-space-oil-synthesis=Unlocks space oil synthesis. Crush carbonic asteroids into hydrocarbon chunks, combine them with water in any assembling machine to produce synthetic crude, then heat the crude in a chemical plant back on the planet to yield crude oil.
bop-fracking=Unlocks the Fracking Station. Place it directly adjacent to any pumpjack to inject high-pressure steam into the formation, slowly boosting yield by up to 10% of the field's original amount.
bop-eor=Unlocks the EOR Injector. Place it near depleted oil fields and supply it with light oil to slowly restore yield — up to 70% of the field's original amount. Takes several hours on large fields.

