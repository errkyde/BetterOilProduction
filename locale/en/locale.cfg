[tips-and-tricks-item-description]
bop-eco-pumpjack=Runs at 0.5× vanilla pump speed but depletes fields ten times slower — net depletion rate is 10% of vanilla. Ideal for patches you want to preserve long-term; pair two Eco pumps to match one vanilla pump's output.
bop-space-synthesis=Carbonic asteroids have a 40% chance to drop Hydrocarbon Chunks when crushed. Combine 4 chunks with water in an assembler to make Synthetic Crude — water comes from ice asteroids. Bring the crude back to the planet and process it in a chemical plant for 300 crude oil per unit.
bop-fracking=Place a Fracking Station directly next to a pumpjack and connect a steam supply. It slowly boosts the field up to 150% of its original richness. The station pauses on its own once the cap is reached and resumes when oil is drawn back down. Limit: one per pumpjack.
bop-eor=Place an EOR Injector directly on a depleted oil field and select an injection recipe. Steam is cheap but slow (~3 h). Light oil is balanced (~40 min). Polymer Slurry is the fastest option (~20 min) but requires its own production line. Recovery caps at 70% of the field's original richness — best applied before fracking.

